name: Generate profile images

# Regenerates the contribution snake and the 3D contribution graph, then
# force-pushes them as a single commit to the `output` branch, which the
# README reads images from. Keeping them off `main` keeps its history clean.
# Only the built-in GITHUB_TOKEN is used; no personal token is needed.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the output branch
    steps:
      - uses: actions/checkout@v7

      # Start from the last published images, so a step that fails keeps
      # yesterday's image instead of dropping it.
      - name: Restore previous images
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output; then
            git --work-tree=dist checkout FETCH_HEAD -- .
            git reset -q
          fi

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution graph
        continue-on-error: true # keep the previous graph if this fails
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D contribution graph
        run: |
          for f in profile-green-animate.svg profile-night-rainbow.svg; do
            if [ -f "profile-3d-contrib/$f" ]; then
              cp "profile-3d-contrib/$f" "dist/$f"
            fi
          done

      - name: Publish to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan output
          mv dist/*.svg .
          git add -- *.svg
          git commit -q -m "Update generated profile images"
          git push --force origin output
